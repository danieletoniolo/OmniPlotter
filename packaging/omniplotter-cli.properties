#
# The console launcher, built on Windows only.
#
# jpackage builds the main launcher as a Windows GUI-subsystem executable, which has no standard
# output to write to: `OmniPlotter.exe convert photo.png` typed into a console prints nothing at
# all, successfully. This one inherits the same jar, main class and runtime and differs only in
# being a console application, so the window can stay free of a flashing black rectangle while the
# command line still has somewhere to print.
#
# The name is `omniplotter-cli` and not `omniplotter` because NTFS is case-insensitive: beside
# `OmniPlotter.exe`, a launcher called `omniplotter.exe` is the same filename, and jpackage stops
# with a file that already exists. The pretty name is not needed here anyway — `omniplotter setup`
# writes a shim called `omniplotter` that points at this.
#
# macOS and Linux do not get one: their main launcher already writes to the terminal that started
# it.
#
win-console=true
