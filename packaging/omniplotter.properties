#
# The console launcher, built on Windows only.
#
# jpackage builds the main launcher as a Windows GUI-subsystem executable, which has no standard
# output to write to: `OmniPlotter.exe convert photo.png` typed into a console prints nothing at
# all, successfully. This second launcher inherits the same jar, main class and runtime and differs
# only in being a console application, so the window can stay free of a flashing black rectangle
# while the command line still has somewhere to print.
#
# macOS and Linux do not get one. Their main launcher already writes to the terminal that started
# it, and on a case-insensitive filesystem `omniplotter` collides with `OmniPlotter` inside
# Contents/MacOS, which jpackage reports as a file that already exists.
#
win-console=true
