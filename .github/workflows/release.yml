name: Release

# A release is a point in time, so a tag is what publishes one. Pushing to main does not.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installers:
    name: Installer for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: deb
          - os: macos-latest
            artifact: dmg
          - os: windows-latest
            artifact: msi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .mvn/repo
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # The tag is the version. Writing it into the POM keeps the jar manifest, what the CLI
      # reports, and what jpackage stamps on the installer all saying the same thing.
      - name: Set the version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing ${VERSION}"
          mvn -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Package
        shell: bash
        run: ./omniplotter.sh package

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: target/installer/*
          if-no-files-found: error

      # The command-line jar carries no JavaFX, so unlike the installers it is the same file
      # everywhere and only needs building once. It is the way in for anyone who already has a
      # JDK 21, wants only the CLI, or is packaging this for a distribution.
      - name: Upload the command-line jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cli-jar
          path: target/omniplotter-*-cli.jar
          if-no-files-found: error

  publish:
    name: Publish release
    needs: installers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # Nothing signs these builds, so a checksum is what is left for telling a good download from
      # a damaged or substituted one. It costs one line and it is the honest thing to publish.
      - name: Checksums
        run: |
          cd installers
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          # None of the installers are signed, so say so rather than let the warnings look like a
          # broken download. The macOS wording matters: the right-click route stopped being
          # reliable, and someone following an instruction that no longer works concludes the
          # download is broken.
          body: |
            ## Install

            Download the installer for your platform below, or `omniplotter-*-cli.jar` if you have
            a JDK 21 and only want the command line.

            These builds are not signed, so both desktops will object the first time.

            **macOS** — the first launch is blocked. Open System Settings → Privacy & Security,
            find the message about OmniPlotter and choose "Open Anyway". From a terminal,
            `xattr -dr com.apple.quarantine /Applications/OmniPlotter.app` does the same thing.

            **Windows** — SmartScreen asks; choose "More info" → "Run anyway".

            `SHA256SUMS` lists the checksum of every file here, which is what there is to verify
            against in the absence of a signature.
