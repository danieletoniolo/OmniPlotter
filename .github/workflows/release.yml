name: Release

# A release is a point in time, so a tag is what publishes one. Pushing to main does not.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installers:
    name: Installer for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: deb
          - os: macos-latest
            artifact: dmg
          - os: windows-latest
            artifact: msi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .mvn/repo
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # The tag is the version. Writing it into the POM keeps the jar manifest, what the CLI
      # reports, and what jpackage stamps on the installer all saying the same thing.
      - name: Set the version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing ${VERSION}"
          mvn -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Package
        shell: bash
        run: ./omniplotter.sh package

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: target/installer/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: installers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          # None of the installers are signed, so say so rather than let the warnings look like a
          # broken download.
          body: |
            ## Install

            Download the installer for your platform below.

            The builds are unsigned. On macOS the first launch needs right-click → Open, and on
            Windows SmartScreen asks for "More info" → "Run anyway".
