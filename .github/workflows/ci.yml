name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # maven.config pins the repository inside the project, so this key covers everything the
      # build downloads.
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: .mvn/repo
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # PreprocessingParityTest compares against a real ImageMagick and skips itself when there is
      # none, so it is only a meaningful check where one is installed.
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick

      # The same command developers run. omniplotter.sh falls back to the JDK and Maven on PATH
      # when tools/ has not been populated by setup.sh.
      - name: Test
        shell: bash
        run: ./omniplotter.sh test

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/

  vectors:
    name: Reference vectors reproduce
    runs-on: ubuntu-latest

    steps:
      # The golden vectors are the project's central claim, and they are committed. This job
      # regenerates them from the pinned img2calc submodule and fails if anything moved, so the
      # claim cannot quietly stop being true.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate
        run: node tools/refgen/refgen.mjs

      - name: Fail if the vectors changed
        run: |
          if [ -n "$(git status --porcelain src/test/resources/ref)" ]; then
            echo "Regenerating the vectors from the pinned reference changed them:"
            git status --short src/test/resources/ref
            echo
            echo "Either the transcription in tools/refgen drifted from the reference, or the"
            echo "submodule was moved deliberately. If deliberate, commit the regenerated vectors."
            exit 1
          fi
          echo "All vectors reproduce from the pinned reference."
