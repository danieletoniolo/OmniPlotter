# The window's text. The command line is not in here: its output is asserted verbatim by
# CliSnapshotTest, and format and target identifiers are an interface rather than prose.
#
# Anything with {0} in it is a MessageFormat pattern, where a literal apostrophe has to be
# written twice. MessagesTest fails the build on a single one, because the symptom is not an
# error but a sentence that quietly loses its arguments.

