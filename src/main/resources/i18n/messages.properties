# --- the tour and the help panel ---
help.open=What is all this?
help.tour.start=Take the tour
help.next=Next
help.back=Back
help.skip=Skip
help.done=Done
help.close=Close
help.tour.files=The files
help.tour.files.says=Drop images or a PDF anywhere on the window, or add them here. Everything in this list is converted when you press Convert.
help.tour.previews=Before and after
help.tour.previews.says=The right-hand picture is the one being produced, and it is the real thing: the dithering and the colour banding you see here are what the calculator will show. The left one is the source, and where you draw a crop or pick a tile.
help.tour.steps=The five steps
help.tour.steps.says=Top to bottom, in the order a conversion happens: which calculator, how big, how it should look, how to cut a page up, what the calculator should call it. A step that is missing does not apply to the file you picked.
help.tour.convert=Converting
help.tour.convert.says=The button says what it is about to do. For a document it means the page on screen; the arrow beside it offers the whole thing. Files are written to the output folder named on the left.
help.concepts=About OmniPlotter
help.concept.what=What this does
help.concept.what.says=It turns images and PDF pages into the picture and script files a graphing calculator can open, byte for byte the way TI-Planet's img2calc does it.
help.concept.mode=Picture file or Python script
help.concept.mode.says=A picture file is opened by the calculator's own picture viewer. A script draws the image from code instead, which is the only route on machines with no picture format — and the only one that runs inside a program you write.
help.concept.format=Why a format is called cp.g3p
help.concept.format.says=The identifiers are the same strings img2calc uses in its URLs, so a link from the web tool names the same thing here. Variants matter: an inverted or obfuscated container is a different file, and only one of them will open.
help.concept.canvas=Canvas and colours
help.concept.canvas.says=The canvas is the calculator's screen in pixels, and a preset fills it exactly — full screen, or the part below the menu bar. Fewer colours means a smaller file and visible banding; the preview shows the banding before anything is written.
help.concept.name=The name on the calculator
help.concept.name.says=Separate from the file name, because the calculator has its own idea of both. Some models address pictures by slot number and have no name at all; some take eight characters. The line under the field says which applies.
help.concept.tiles=Tiles, and why columns matter
help.concept.tiles.says=A whole A4 page on a 384-pixel screen is unreadable, so the page is cut into pieces that each fill the screen. Only the number of columns buys resolution: cutting a page across gains nothing, which is why the picker reports the dpi and how tall a line of type ends up rather than only the number of pieces.
help.concept.logs=When something goes wrong
help.concept.logs.says=The log folder is in the menu beside this button, and it is what a bug report needs. The same menu sets up the omniplotter terminal command, which converts whole documents at once and does everything this window does.
