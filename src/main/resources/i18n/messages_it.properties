# --- il tour e il pannello di aiuto ---
help.open=Che cos'è tutto questo?
help.tour.start=Fai il tour
help.next=Avanti
help.back=Indietro
help.skip=Salta
help.done=Fatto
help.close=Chiudi
help.tour.files=I file
help.tour.files.says=Trascina immagini o un PDF in qualsiasi punto della finestra, oppure aggiungili qui. Tutto quello che è in questa lista viene convertito quando premi Converti.
help.tour.previews=Prima e dopo
help.tour.previews.says=L'immagine di destra è quella che viene prodotta, ed è quella vera: la retinatura e le bande di colore che vedi qui sono quelle che mostrerà la calcolatrice. Quella di sinistra è l'originale, ed è dove disegni un ritaglio o scegli una tessera.
help.tour.steps=I cinque passaggi
help.tour.steps.says=Dall'alto in basso, nell'ordine in cui avviene una conversione: quale calcolatrice, quanto grande, come deve venire, come tagliare una pagina, come la deve chiamare la calcolatrice. Un passaggio che manca non riguarda il file che hai scelto.
help.tour.convert=Convertire
help.tour.convert.says=Il pulsante dice quello che sta per fare. Per un documento vuol dire la pagina che vedi; la freccia accanto offre tutto il documento. I file vengono scritti nella cartella indicata a sinistra.
help.concepts=Su OmniPlotter
help.concept.what=Che cosa fa
help.concept.what.says=Trasforma immagini e pagine PDF nei file immagine e negli script che una calcolatrice grafica sa aprire, byte per byte come li fa img2calc di TI-Planet.
help.concept.mode=File immagine o script Python
help.concept.mode.says=Un file immagine viene aperto dal visualizzatore della calcolatrice. Uno script invece disegna l'immagine da codice, che è l'unica strada sulle macchine senza un formato immagine — e l'unica che funziona dentro un programma scritto da te.
help.concept.format=Perché un formato si chiama cp.g3p
help.concept.format.says=Gli identificatori sono le stesse stringhe che img2calc usa nei suoi URL, così un link dallo strumento web indica la stessa cosa qui. Le varianti contano: un contenitore invertito o offuscato è un file diverso, e solo uno dei due si aprirà.
help.concept.canvas=Area di disegno e colori
help.concept.canvas.says=L'area di disegno è lo schermo della calcolatrice in pixel, e un preset lo riempie esattamente: tutto lo schermo, o la parte sotto la barra dei menu. Meno colori vuol dire un file più piccolo e bande visibili; l'anteprima le mostra prima che venga scritto qualcosa.
help.concept.name=Il nome sulla calcolatrice
help.concept.name.says=È diverso dal nome del file, perché la calcolatrice ha una sua idea di entrambi. Alcuni modelli indirizzano le immagini per numero di slot e non hanno nessun nome; altri accettano otto caratteri. La riga sotto il campo dice quale dei due vale.
help.concept.tiles=Le tessere, e perché contano le colonne
help.concept.tiles.says=Una pagina A4 intera su uno schermo di 384 pixel è illeggibile, quindi la pagina viene tagliata in pezzi che riempiono lo schermo uno per uno. Solo il numero di colonne dà risoluzione: tagliare una pagina in orizzontale non guadagna niente, ed è per questo che l'elenco riporta i dpi e l'altezza di una riga di testo invece del solo numero di pezzi.
help.concept.logs=Quando qualcosa va storto
help.concept.logs.says=La cartella dei log è nel menu accanto a questo pulsante, ed è quello che serve a una segnalazione. Lo stesso menu configura il comando omniplotter da terminale, che converte documenti interi in una volta e fa tutto quello che fa questa finestra.
